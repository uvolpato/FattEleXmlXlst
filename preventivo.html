<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preventivo — FattEleXmlXlst</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" rel="stylesheet">
<style>
:root{--db-primary:#0d6efd;--db-dark:#212529;--db-bg:#f5f6f8;--db-border:#dee2e6;--db-muted:#6c757d;--db-surface:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--db-bg);color:var(--db-dark);min-height:100vh;display:flex;flex-direction:column}
.navbar-custom{background:var(--db-dark)!important}
.navbar-custom .navbar-brand{font-weight:600;color:#fff!important;font-size:1rem}
.navbar-custom .nav-link{color:rgba(255,255,255,.7)!important;font-size:.875rem}
.navbar-custom .nav-link:hover{color:#fff!important}
.viewer-wrap{flex:1;padding:1.5rem 0 3rem}
.viewer-card{background:var(--db-surface);border:1px solid var(--db-border);border-radius:10px;padding:2rem 2.5rem;max-width:900px;margin:0 auto}
.viewer-card h1{font-size:1.6rem;font-weight:700;margin-bottom:.5rem;border-bottom:2px solid var(--db-border);padding-bottom:.5rem}
.viewer-card h2{font-size:1.25rem;font-weight:600;margin-top:2rem;margin-bottom:.75rem;color:var(--db-dark)}
.viewer-card h3{font-size:1.05rem;font-weight:600;margin-top:1.5rem;margin-bottom:.5rem}
.viewer-card p{line-height:1.65;margin-bottom:.75rem;font-size:.95rem}
.viewer-card ul,.viewer-card ol{padding-left:1.5rem;margin-bottom:.75rem;line-height:1.65}
.viewer-card li{margin-bottom:.3rem;font-size:.95rem}
.viewer-card table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.88rem}
.viewer-card th,.viewer-card td{border:1px solid var(--db-border);padding:.45rem .65rem;text-align:left}
.viewer-card th{background:#e9ecef;font-weight:600;position:sticky;top:0}
.viewer-card code{background:#f1f3f5;padding:.15rem .35rem;border-radius:4px;font-size:.88em;font-family:ui-monospace,"Cascadia Code",Menlo,monospace}
.viewer-card pre{background:#f6f8fa;border:1px solid var(--db-border);border-radius:6px;padding:1rem;overflow-x:auto;margin:1rem 0}
.viewer-card pre code{background:none;padding:0;font-size:.85rem}
.viewer-card strong{font-weight:600}
.viewer-card a{color:var(--db-primary);text-decoration:none}
.viewer-card a:hover{text-decoration:underline}
.viewer-card blockquote{border-left:3px solid var(--db-primary);padding:.5rem 1rem;margin:1rem 0;color:var(--db-muted);background:#f8f9fa;border-radius:0 6px 6px 0}
.viewer-card hr{border:none;border-top:1px solid var(--db-border);margin:1.5rem 0}
@media(max-width:768px){.viewer-card{padding:1.25rem;margin:0 .75rem}}
</style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark navbar-custom">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-file-earmark-spreadsheet me-2"></i>FattEleXmlXlst
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Home</a>
      <a class="nav-link" href="prototype.html"><i class="bi bi-play-circle me-1"></i>Prototipo</a>
    </div>
  </div>
</nav>

<div class="viewer-wrap">
  <div class="container">
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb" style="font-size:.85rem">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Preventivo</li>
      </ol>
    </nav>
    <div class="viewer-card" id="md-content">
      <div class="text-center py-5 text-muted"><i class="bi bi-hourglass-split"></i> Caricamento...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script>
marked.setOptions({breaks:true,gfm:true,highlight:function(code,lang){if(lang&&hljs.getLanguage(lang)){try{return hljs.highlight(code,{language:lang}).value}catch(e){}}return code;}});
fetch('preventivo.md').then(function(r){return r.text();}).then(function(md){document.getElementById('md-content').innerHTML=marked.parse(md);}).catch(function(){document.getElementById('md-content').innerHTML='<p class="text-danger">Impossibile caricare il file.</p>';});
</script>

</body>
</html>
